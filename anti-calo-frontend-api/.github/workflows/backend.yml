name: Backend tests

on:
  push:
    branches: [main, 'feature/**']
    paths: ['backend/**', 'shared/abi/**', 'blockchain/contracts/**', 'src/**', 'tests/**', 'backend.html', 'vite.config.js', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'shared/abi/**', 'blockchain/contracts/**', 'src/**', 'tests/**', 'backend.html', 'vite.config.js', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install blockchain dependencies (untuk E2E)
        working-directory: blockchain
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Unit dan integrasi API
        working-directory: backend
        run: npm test

      - name: E2E kontrak asli
        working-directory: backend
        run: npm run test:e2e

      - name: Install frontend dependencies
        run: npm ci

      - name: Tes frontend (termasuk kompatibilitas klien-backend)
        run: npm test
